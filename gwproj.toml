[device]
part = "GW5AST-LV138PG484AC1/I0"
version = "B"

[files]
cst = "src/hdmi.cst"
sdc = "src/hdmi.sdc"
verilog = [
# top and video setup
"target/src/top.sv",
"src/dvi-tx/dvi_tx_clk_drv.v",
"src/dvi-tx/dvi_tx_tmds_enc.v",
"src/dvi-tx/dvi_tx_tmds_phy.v",
"src/dvi-tx/dvi_tx_top.v",
"src/gowin_pll/gowin_pll.v",
"src/gowin_pll/gowin_pll_mod.v",
"src/gowin_pll/pll_init.v",
"src/video-misc/video_timing_ctrl.v",

# actual project 
"target/src/actual/actual_top.sv",
"target/src/actual/generator_top.sv",
"src/actual/picorv32.sv",
"target/src/actual/board_state.sv",
"target/src/actual/colors.sv",
"target/src/actual/types.sv",
"src/actual/code_memory.sv",
"src/actual/tiles.sv",
]

[options]
verilog_std = "sysv2017"
top_module = "top"
place_option = 3
route_option = 2
bit_compress = true
cst_warn_to_error = true
rpt_auto_place_io_info = true
use_sspi_as_gpio = true
# use_mspi_as_gpio = true
use_cpu_as_gpio = true
looplimit = 5000
# inc_place = "auto"
# inc_pnr = "auto"
